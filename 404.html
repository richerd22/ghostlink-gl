<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>GHOST LINK</title>
<link rel="icon" href="/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<main>
<header>
<pre class="ghost asleep" id="ghost" aria-hidden="true">  .--.
 / __ \
|      |
|      |
 \/\/\/</pre>
<h1 id="unit">GHOST LINK</h1>
</header>
<!-- SHORT LINKS: gl.cold.fyi/<unit>[/<role> | /watch | /s/<token> | /night[/<date>]] (DECISIONS #45, #111).
     GitHub Pages serves this page for every path it doesn't have, so each unit's links need no file of their own.
     The unit name is set on the box (share panel -> CHANGE NAME), which files its address in here.json and its
     WATCH FROM HOME link in watch.json under that name. The route logic is in finder.js (tested under Node):
     same Wi-Fi as the box: straight to the box. Not here but live: WATCH FROM HOME. Otherwise: not reachable now. -->
<p class="big" id="msg">Looking for it…</p>
<p class="small" id="sub"></p>
<p><a class="button" id="go" hidden>OPEN</a></p>
<div id="how" hidden>
  <p>At the venue: join the Wi-Fi <b>GHOST LINK</b> (password on the sticker), then open this link again.</p>
  <p><a class="button" href="http://10.42.0.1/">OPEN THE DASHBOARD</a></p>
</div>
<footer>made with &lt;3 in Boston by <a href="https://thirdpolararch.com">Third Polar Arch</a> · <a href="https://thirdpolararch.com/terms">Terms</a> · <a href="https://thirdpolararch.com/privacy">Privacy</a></footer>
</main>
<script src="/finder.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const first = Finder.parse(location.pathname, location.search);
  if (first.bad) { $('msg').textContent = 'No GHOST LINK here.'; $('how').hidden = false; return; }
  $('unit').textContent = first.name.toUpperCase();
  const go = (url, label, now) => {
    $('go').href = url; $('go').textContent = label; $('go').hidden = false;
    $('ghost').textContent = '  .--.\n / oo \\\n|      |\n|      |\n \\/\\/\\/'; $('ghost').className = 'ghost';
    if (now) setTimeout(() => location.replace(url), 500);
  };
  const OPEN = { home: 'OPEN', watch: 'WATCH LIVE', share: 'OPEN THE LINK', night: 'OPEN THE NIGHT' };
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 7000);
    const raw = f => fetch('https://raw.githubusercontent.com/richerd22/ghostlink-gl/main/' + f + '?t=' + Math.floor(Date.now() / 60000), { cache: 'no-store', signal: ctl.signal }).then(r => r.ok ? r.json() : null).catch(() => null);
    const [here, watch, ip] = await Promise.all([raw('here.json'), raw('watch.json'),
      fetch('https://api.ipify.org?format=json', { cache: 'no-store', signal: ctl.signal }).then(r => r.json()).then(j => j.ip).catch(() => null)]);
    let net = null;
    if (here && ip && crypto.subtle && /^[0-9.]{7,15}$/.test(ip)) {
      const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(ip), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: new TextEncoder().encode('ghostlink-here-v1'), iterations: 100000 }, key, 128);
      net = [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
    const r = Finder.route({ path: location.pathname, search: location.search, here, watch, net, now: Date.now() });
    $('unit').textContent = r.title;
    if (r.kind === 'lan') {
      $('msg').textContent = 'On this Wi-Fi. Opening…';
      $('sub').textContent = 'If nothing happens, tap ' + OPEN[r.what] + '.';
      return go(r.url, OPEN[r.what], true);
    }
    if (r.kind === 'live') {
      $('msg').textContent = r.what === 'home' ? 'Live now. Opening the view-only link…' : 'Live now. Opening…';
      $('sub').textContent = r.what === 'home' ? 'You are not on the venue Wi-Fi, so this is WATCH FROM HOME (view only).' : 'Through WATCH FROM HOME, the link that works from anywhere.';
      return go(r.url, r.what === 'home' ? 'WATCH LIVE' : OPEN[r.what], true);
    }
    if (r.kind === 'ended') {
      $('msg').textContent = 'This link has ended.';
      $('sub').textContent = r.why === 'expired' ? 'It ran out. Ask whoever sent it for a new one.' : "It isn't a whole link. Check it was copied in full.";
      return;
    }
    if (r.kind === 'unknown') { $('msg').textContent = 'No GHOST LINK called ' + first.name + '.'; $('sub').textContent = 'Check the spelling on the sticker.'; return; }
    if (r.kind === 'wrongbox') {
      $('msg').textContent = 'This link is for a different GHOST LINK.';
      $('sub').textContent = "It isn't live right now. The link works again when that box is on this Wi-Fi or on WATCH FROM HOME.";
      return;
    }
    $('msg').textContent = r.title + " isn't reachable right now.";
    $('sub').textContent = 'This link works again when ' + r.title + ' is live: on this Wi-Fi, or with WATCH FROM HOME on.';
    $('how').hidden = false;
  } catch (e) {
    $('msg').textContent = "Couldn't look it up."; $('how').hidden = false;
  }
})();
</script>
</body>
</html>
